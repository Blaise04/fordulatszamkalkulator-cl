name: Webes app (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Pages beállítása
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Webes app csomagolása
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Közzététel
        id: deployment
        uses: actions/deploy-pages@v4
