name: APK build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tesztek
        run: gradle testDebugUnitTest --no-daemon

      - name: Teszt APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Kiadási APK (aláírt release)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "FordulatszamkalkulatorCL-${VERSION_CODE}.apk"

      - name: Teszt APK átnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk "FordulatszamkalkulatorCL-${VERSION_CODE}-teszt.apk"

      - name: Teszt APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: FordulatszamkalkulatorCL-teszt-apk
          path: FordulatszamkalkulatorCL-*-teszt.apk

      - name: Kiadási APK feltöltése
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FordulatszamkalkulatorCL-apk
          path: FordulatszamkalkulatorCL-${{ github.run_number }}.apk

      - name: Tesztjelentés feltöltése hiba esetén
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teszt-jelentes
          path: app/build/reports/tests/
