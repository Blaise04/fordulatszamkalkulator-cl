name: APK build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tesztek
        run: gradle testDebugUnitTest --no-daemon

      - name: Teszt APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Kiadási APK (aláírt release)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "FordulatszamkalkulatorCL-${VERSION_CODE}.apk"

      - name: Teszt APK átnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk "FordulatszamkalkulatorCL-${VERSION_CODE}-teszt.apk"

      - name: Teszt APK feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: FordulatszamkalkulatorCL-teszt-apk
          path: FordulatszamkalkulatorCL-*-teszt.apk

      - name: Kiadási APK feltöltése
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FordulatszamkalkulatorCL-apk
          path: FordulatszamkalkulatorCL-${{ github.run_number }}.apk

      # ---------- Nyilvános letöltés: GitHub Release ----------
      # Aláíró kulccsal: végleges kiadás, a "latest" link erre mutat.
      # Kulcs nélkül: teszt előzetes kiadás (prerelease), a "latest" linket nem írja felül.
      - name: Release fájl előkészítése
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp "FordulatszamkalkulatorCL-${VERSION_CODE}.apk" release/FordulatszamkalkulatorCL.apk
          else
            cp "FordulatszamkalkulatorCL-${VERSION_CODE}-teszt.apk" release/FordulatszamkalkulatorCL-teszt.apk
          fi

      - name: GitHub Release – végleges
        if: github.event_name != 'pull_request' && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fordulatszámkalkulátor CL 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          files: release/FordulatszamkalkulatorCL.apk
          body: |
            **Letöltés:** kattints lent a `FordulatszamkalkulatorCL.apk` fájlra, majd nyisd meg a telefonon.
            Ha az Android rákérdez, engedélyezd a telepítést ebből a forrásból.

            Állandó link a mindenkori legfrissebb verzióhoz:
            https://github.com/${{ github.repository }}/releases/latest/download/FordulatszamkalkulatorCL.apk

      - name: GitHub Release – teszt
        if: github.event_name != 'pull_request' && env.HAS_KEYSTORE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-teszt
          name: Fordulatszámkalkulátor CL 1.0.${{ github.run_number }} (teszt)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: 'false'
          files: release/FordulatszamkalkulatorCL-teszt.apk
          body: |
            **Teszt változat** – kipróbálásra. Nem a végleges aláíró kulccsal készült, ezért a végleges
            kiadás előtt el kell távolítani a telefonról.

            A végleges kiadásokhoz állítsd be az aláíró kulcsot (lásd README), utána az állandó link:
            https://github.com/${{ github.repository }}/releases/latest/download/FordulatszamkalkulatorCL.apk

      - name: Tesztjelentés feltöltése hiba esetén
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: teszt-jelentes
          path: app/build/reports/tests/
